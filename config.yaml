# researchagen — config.yaml (профиль Hermes Agent)
# Все ключи сверены с документацией hermes-agent (configuration / profiles /
# cron / goals / loops / kanban / skills / profile-distributions).
# Подстановки ${VAR} берутся из .env — секреты в config.yaml не попадают.
# Установщик (install.ps1 / install.sh) правит только помеченные <<INSTALLER>> строки.

# ---------------------------------------------------------------- модель
providers:
  local_qwen:
    base_url: ${RESEARCHAGEN_MODEL_BASE_URL}   # <<INSTALLER>> http://localhost:11434/v1
    api_key: ${RESEARCHAGEN_MODEL_API_KEY}
    request_timeout_seconds: 1800
    stale_timeout_seconds: 0                   # локальный endpoint: детектор «зависания» выкл

model:
  provider: local_qwen
  default: ${RESEARCHAGEN_MODEL_NAME}          # <<INSTALLER>> qwen3:27b-q6_K
  # Реальное окно Qwen3-27B Q6 + KV-cache Q8 на 32 GB VRAM. От этого числа
  # считается порог компрессии — завышать опасно.
  context_length: 32768                        # <<INSTALLER>>

agent:
  reasoning_effort: medium
  clarify_timeout: 900                         # 15 мин на ответ на inline-кнопку, потом решает сам

# ---------------------------------------------------------------- native Hermes delegation
# Это только верхняя граница batch. Реальное число workers выбирает parent
# через tools/rg.py governor plan и reserve; max_concurrent_children не является
# GPU-lock и не заменяет admission controller.
delegation:
  max_iterations: 16                           # короткий leaf-turn; checkpoint в SQLite
  max_concurrent_children: 2                    # conservative cap для одной GPU
  max_spawn_depth: 1                            # flat: parent → leaf, без swarm tree
  orchestrator_enabled: false                   # nested fan-out запрещён
  provider: local_qwen
  model: ${RESEARCHAGEN_MODEL_NAME}

# ---------------------------------------------------------------- терминал
terminal:
  backend: local
  cwd: ${RESEARCHAGEN_HOME}                    # <<INSTALLER>> абсолютный путь к рабочей папке
  timeout: 900                                 # короткие команды; обучение запускать background=true
  home_mode: auto
  env_passthrough:
    - RESEARCHAGEN_HOME
    - CUDA_VISIBLE_DEVICES

# ---------------------------------------------------------------- память и контекст
memory:
  memory_enabled: true
  memory_char_limit: 2400
  write_approval: false

compression:
  enabled: true
  threshold: 0.55                              # доля окна (НЕ токены)
  protect_last_n: 20
  idle_compact_after_seconds: 1800

skills:
  guard_agent_created: false
  write_approval: false

# ---------------------------------------------------------------- автономия
goals:
  max_turns: 30                                # бюджет автопродолжений /goal

loops:
  min_interval_seconds: 60
  max_ticks: 0                                 # 0 = без потолка: мониторинг прогона должен доживать до конца
  self_paced_floor_seconds: 60
  self_paced_ceiling_seconds: 900

cron:
  preflight: true                              # мисконфигурированный тик не тратит токены
  model_drift_guard: true
  failure_nudge_threshold: 3
  allow_agent_scheduling: false                # контур фиксирован: никаких саморазмножающихся тасков

kanban:
  dispatch_in_gateway: true
  failure_limit: 2

# aux-задачи. По умолчанию всё на локальной модели (ноль внешних затрат).
# Если установщик получил OPENROUTER_API_KEY — он раскомментирует облачные слоты:
# judge и compression — единственные места, где слабая локальная модель реально вредит.
auxiliary:
  goal_judge:
    provider: local_qwen                       # <<INSTALLER>> openrouter, если есть ключ
    model: ${RESEARCHAGEN_MODEL_NAME}          # <<INSTALLER>> google/gemini-2.5-flash
    max_tokens: 400
  compression:
    provider: local_qwen                       # <<INSTALLER>>
    model: ${RESEARCHAGEN_MODEL_NAME}          # <<INSTALLER>>
  title_generation:
    provider: local_qwen
    model: ${RESEARCHAGEN_MODEL_NAME}
  approval:
    provider: local_qwen
    model: ${RESEARCHAGEN_MODEL_NAME}

# ---------------------------------------------------------------- быстрые команды
# exec-алиасы: работают и в CLI, и в Telegram, без хода модели (0 токенов).
quick_commands:
  gpu:
    type: exec
    command: python tools/gpu.py show
  q:
    type: exec
    command: python tools/queue.py list --top 12
  st:
    type: exec
    command: python tools/rg.py status
  panel:
    type: exec
    command: python tools/rg.py panel
  aichat:
    type: exec
    command: python tools/rg.py aichat --n 40
  doctor:
    type: exec
    command: python tools/selfcheck.py all
  governor:
    type: exec
    command: python tools/rg.py governor plan --json

# ---------------------------------------------------------------- Telegram
platforms:
  telegram:
    extra:
      rich_messages: true                      # нативные таблицы/task-list — очередь читаема
      rich_drafts: false
      disable_link_previews: true
      status_indicator: true
      status_online: "🟢 researchagen: контур активен"
      status_offline: "🔴 researchagen: gateway остановлен"
      command_menu:
        max_commands: 60
        priority_mode: prepend
        priority: [panel, pool, next, dr, add, launch, v, h, digest, gpu, governor, auto, aichat]
      dm_topics:
        - chat_id: ${TELEGRAM_HOME_CHANNEL}     # <<INSTALLER>>
          ignore_root_dm: false
          topics:
            - { name: "📊 Штаб",         icon_color: 7322096 }
            - { name: "🔬 Research",      icon_color: 16766590, skill: dr }
            - { name: "📋 Очередь",      icon_color: 9367192,  skill: pool }
            - { name: "🧪 Эксперименты", icon_color: 4368165,  skill: launch }
            - { name: "⚖️ Вердикты",     icon_color: 16753697, skill: verdict }
            - { name: "💬 aichat",        icon_color: 16749890, skill: aichat }

gateway:
  streaming:
    enabled: true
    transport: auto                            # native draft-стриминг, fallback — edit

display:
  tool_progress_command: true
  platforms:
    telegram:
      notifications: important                 # пуш только на вердикты/подтверждения

runtime:
  nofile_soft_limit: 4096

database:
  journal_mode: wal

# ---------------------------------------------------------------- собственные ключи профиля
# Читаются только инструментами tools/*.py через tools/core.py.
# Hermes игнорирует неизвестные топ-левел секции.
researchagen:
  platform: <<INSTALLER_PLATFORM>>              # windows | macos | linux
  mode: <<INSTALLER_MODE>>                      # production | debug
  autolaunch: true                             # R4: автозапуск экспериментов
  limits:
    approval_gpu_hours: 12                     # R7: дороже — только с /approve
    min_live_hypotheses: 3                     # R2
    preempt_ratio: 2.0                         # R6
    gpu_free_gb_required: 20                   # минимум свободной VRAM для L1+
    max_parallel_experiments: 1                # GPU — один ресурс
    daily_gpu_hours_budget: 20
  # Autonomous admission around native delegate_task/Kanban workers.
  # research_worker_vram_gb and thresholds are conservative starting points;
  # calibrate them with a live Qwen/GPU benchmark before raising the cap.
  governor:
    enabled: true
    default_mode: discover
    max_research_children: 2                   # dynamic capacity never exceeds this
    max_triage_children: 1                     # kill-stage / synthesis is narrower
    research_worker_vram_gb: 4                  # estimated incremental KV/cache budget
    experiment_reserve_gb: 8                   # keep headroom before a GPU experiment
    min_free_vram_gb: 4                        # below this: fail closed
    low_free_vram_gb: 6                        # degraded path: at most one worker
    critical_free_vram_gb: 2                   # below this: zero workers
    high_utilization_pct: 85                   # degraded path: at most one worker
    saturated_utilization_pct: 95               # zero workers
    daily_research_task_budget: 12             # admission units/day; 0 = unlimited
    lease_ttl_seconds: 300
    debug_research_capacity: 1
    prioritize_ready_experiments: true
    hermes_cron_control: true                  # pause/resume research-loop in testing
    research_cron_job: research-loop
  pi_weights:                                  # пересчитываются cron'ом weekly-recalib
    signals: 0.22
    novelty: 0.16
    early: 0.12
    standard: 0.14
    money: 0.14
    decidability: 0.22
  aging:
    per_day: 0.05
    cap: 0.30
  bins:                                        # границы корзин в GPU-часах
    p1_max_hours: 4
    p2_max_hours: 12
    p3_max_hours: 48
  cascade:
    l0_max_minutes: 5
    l1_max_minutes: 60
    l1_min_seeds: 3
    l2_max_hours: 8
    l3_min_seeds: 5
  telegram:
    progress_every_seconds: 900                # карточка прогресса не чаще раза в 15 мин
    digest_hour: 9
  crew:                                        # «aichat»: рабочая переписка экипажа ИИ-агентов
    enabled: true
    # Топик «💬 aichat»: его thread_id в .env (TELEGRAM_AICHAT_THREAD_ID).
    # Нет топика — переписка пишется только в базу, контур не страдает.
    thread_env: TELEGRAM_AICHAT_THREAD_ID
    max_messages_per_day: 100                  # жёсткий бюджет сообщений в сутки
    max_lines_per_event: 5                     # реплик на одну сцену
    dispute_probability: 0.35                  # шанс спора-«проверки на прочность»
    nudge_probability: 0.20                    # шанс фразы-нуджа (приоры 95%/90%)
    customer_share_max: 0.06                   # потолок реплик про заказчика/AGI (~5%)
    noise_share_max: 0.03                     # потолок «кек/лол/епт» (~2%)
    customer_line_probability: 0.25           # шанс такой реплики в сцене
    noise_line_probability: 0.10
    joke_probability: 0.15            # шанс 7-слойной шутки (интенсивность 0–100)
    review_interval_seconds: 1800              # период взаимного ревью (косяки)
    quiet_hours: ""                            # например "23:00-07:59": ночью только в лог
    agi_arrival: "2030-05-01"                  # Часы AGI для «шёпота»
  bottom_detection:                            # гибридный поисковый слой
    enabled: true
    domain: training-dynamics
    llm_model: local
    mcp_tools: arxiv,pubmed,google_scholar,github
    transformation_dictionary: null               # optional JSON path
    num_initial_regions: 10
    max_parallel_evaluations: 5                # hard cap: 1..10
    max_iterations: 200                       # per run; state iteration is cumulative
    target_confirmed_hypotheses: 3
    max_cost_usd: 10
    mcp_rate_limit: 100                         # запросов/час
    mcp_cache_ttl_hours: 24
    retry_attempts: 3
    retry_base_seconds: 0.25
    region_no_signal_limit: 2
    min_signal_score: 0.55
    max_region_depth: 3
    max_candidates_per_region: 4
    max_transformations_per_hypothesis: 8
    enable_metrics: true
    log_level: INFO
    log_format: json
